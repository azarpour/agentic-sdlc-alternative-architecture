
name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

  java:
    runs-on: ubuntu-latest

    env:
      DOCKER_API_VERSION: '1.44'
      JAVA_TOOL_OPTIONS: '-Dapi.version=1.44'

    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: greenfield
            project: baselines/greenfield-verified

          - scenario: brownfield
            project: runs/0dae8850-00ce-4106-8908-9ddfb7a30741/candidate

          - scenario: ambiguous
            project: runs/94e9c2a1-7ac5-44f9-b1e5-46e10a0debd4/candidate

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker environment
        run: docker version

      - name: Verify project exists
        run: test -f "${{ matrix.project }}/pom.xml"

      - name: Run Maven verification
        run: mvn -B -f "${{ matrix.project }}/pom.xml" clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: java-test-reports-${{ matrix.scenario }}
          path: |
            ${{ matrix.project }}/target/surefire-reports/**
            ${{ matrix.project }}/target/failsafe-reports/**
